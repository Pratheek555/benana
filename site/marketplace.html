<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>benana · marketplace</title>
  <meta name="description" content="Minecraft mods made with Benana's AI studio, playtested by an AI player." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ffd60a'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%230b0b0b'/%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#050505; --panel:#0e0e0f; --line:rgba(255,255,255,.09); --ink:#f3f1ea; --dim:#9b9ea8; --bee:#ffd60a; --good:#4cc38a; --bad:#e5484d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 Manrope, system-ui, sans-serif; }
    a { color:inherit; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px clamp(16px,4vw,48px); border-bottom:1px solid var(--line); }
    header a.brand { font-weight:600; font-size:18px; text-decoration:none; }
    header nav a { margin-left:18px; color:var(--dim); text-decoration:none; font-size:14px; }
    main { padding: 32px clamp(16px,4vw,48px) 64px; max-width:1200px; margin:0 auto; }
    h1 { font-size: clamp(30px,4vw,44px); letter-spacing:-.03em; margin:0 0 8px; font-weight:500; }
    .lede { color:var(--dim); max-width:620px; margin:0 0 28px; }
    .status { color:var(--dim); font:400 12px 'DM Mono', monospace; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; }
    .card:hover { border-color: rgba(255,214,10,.45); }
    .card h2 { font-size:18px; margin:0; font-weight:600; }
    .card p { margin:0; color:var(--dim); font-size:14px; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; font:400 12px 'DM Mono', monospace; color:var(--dim); }
    .pill { border:1px solid var(--line); border-radius:99px; padding:2px 9px; }
    .pill.ok { color:var(--good); border-color: rgba(76,195,138,.4); }
    .pill.bad { color:var(--bad); border-color: rgba(229,72,77,.4); }
    .actions { margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; }
    .btn { display:inline-block; padding:9px 14px; border-radius:10px; text-decoration:none; font-weight:600; font-size:14px; background:var(--bee); color:#111; }
    .btn.ghost { background:none; border:1px solid var(--line); color:var(--ink); font-weight:500; }
    .empty, .err { color:var(--dim); padding:40px 0; }
    .err { color:var(--bad); }
    .detail { display:grid; grid-template-columns: 1fr; gap:14px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
    .panel h2 { font-size:17px; margin:0 0 10px; font-weight:600; }
    .panel h3 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:18px 0 8px; font-weight:600; }
    .panel p { margin:0 0 10px; }
    .muted { color:var(--dim); font-size:13.5px; }
    .panel.entire { border-color: rgba(167,139,250,.45); }
    .panel.entire h2 { color:#c4b5fd; }
    .pill.ok { color:var(--good); }
    .timeline { list-style:none; margin:0; padding:0; border-left:2px solid var(--line); }
    .timeline li { padding:0 0 14px 16px; position:relative; }
    .timeline li::before { content:""; position:absolute; left:-6px; top:4px; width:10px; height:10px; border-radius:3px; background:#a78bfa; }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:4px; }
    .row code { font:12px 'DM Mono', monospace; }
    .files code { display:inline-block; margin:2px 4px 2px 0; padding:2px 6px; border:1px solid var(--line); border-radius:6px; font:11.5px 'DM Mono', monospace; color:var(--dim); }
    .facts { display:grid; grid-template-columns: 110px 1fr; gap:6px 12px; margin:0; font-size:13px; }
    .facts dt { color:var(--dim); } .facts dd { margin:0; overflow-wrap:anywhere; }
    .facts code { font:12px 'DM Mono', monospace; }
    .pill.ok { border-color: rgba(76,195,138,.4); }
    .explorer { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap:12px; margin-bottom:16px; }
    .cp-list { list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:10px; max-height:360px; overflow:auto; }
    .cp-list li + li { border-top:1px solid var(--line); }
    .cp-list button { display:grid; gap:2px; width:100%; padding:10px 12px; background:none; border:0; color:var(--dim); text-align:left; font:13px Manrope, sans-serif; cursor:pointer; }
    .cp-list button:hover { background:rgba(255,255,255,.04); }
    .cp-list button.on { background:rgba(167,139,250,.12); color:var(--ink); box-shadow: inset 2px 0 0 #a78bfa; }
    .cp-list code { font:12px 'DM Mono', monospace; color:var(--ink); }
    .cp-list small { color:var(--dim); font-size:11px; }
    .cp-detail { border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--bg); display:grid; gap:12px; align-content:start; }
    .cp-detail .btn { justify-self:start; }
    .cp-list li { position:relative; }
    .cp-list .tip { display:none; position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%); width:320px; z-index:5; padding:10px 12px; border-radius:10px; background:#111; border:1px solid rgba(167,139,250,.5); color:var(--ink); font:12.5px/1.5 Manrope, sans-serif; box-shadow:0 12px 30px rgba(0,0,0,.5); pointer-events:none; }
    .cp-list li:hover .tip { display:block; }
    .cp-list .tip b { color:#c4b5fd; font-weight:600; }
    .summary { display:grid; gap:6px; padding:12px; border:1px solid rgba(167,139,250,.35); border-radius:10px; font-size:13.5px; }
    .summary p { margin:0; }
    .summary .label { font:600 11px 'DM Mono', monospace; text-transform:uppercase; color:#c4b5fd; letter-spacing:.06em; }
    @media (max-width: 760px) { .explorer { grid-template-columns:1fr; } .cp-list .tip { display:none !important; } }
    .changes { list-style:none; margin:10px 0 0; padding:0; }
    .changes li { padding:10px 0; border-top:1px solid var(--line); }
    .status { font:600 11px 'DM Mono', monospace; text-transform:uppercase; padding:2px 7px; border-radius:6px; }
    .s-A { background:rgba(76,195,138,.15); color:var(--good); } .s-M { background:rgba(255,214,10,.12); color:var(--bee); } .s-D { background:rgba(229,72,77,.15); color:var(--bad); }
    .pill { font-size:11.5px; } .panel .pill { font-size:12px; }
    @media (min-width: 900px) { .detail { grid-template-columns: 1fr 1fr; } .detail .entire { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">benana</a>
    <nav><a href="/">home</a><a href="/marketplace.html" aria-current="page">marketplace</a></nav>
  </header>
  <main>
    <h1>Marketplace</h1>
    <p class="lede">Mods made in Benana's studio. Each one was built by an AI agent, then tested by an AI player on a live Paper server. Open a mod in the app to install it.</p>
    <div id="status" class="status">loading mods…</div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script type="module" src="/src/marketplace.js"></script>
</body>
</html>
